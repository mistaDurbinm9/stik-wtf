<template id="pix-stik">
  <svg class="pix-stik" viewBox="0 0 12 14" width="36" height="42" aria-hidden="true" shape-rendering="crispEdges">
    <!-- halo: bg-colored silhouette so the rider reads over any content -->
    <g fill="var(--bg)">
      <rect x="4" y="0" width="5" height="6"/>
      <rect x="2" y="4" width="9" height="4"/>
      <rect x="2" y="6" width="5" height="5"/>
      <rect x="6" y="6" width="5" height="5"/>
      <rect x="1" y="9" width="11" height="3"/>
      <rect x="4" y="7" width="5" height="7"/>
    </g>
    <g fill="var(--ink)">
      <g class="fr1">
        <rect x="5" y="1" width="3" height="3"/>
        <rect x="6" y="4" width="1" height="3"/>
        <rect x="3" y="5" width="7" height="1"/>
      </g>
      <g class="fr2">
        <rect x="5" y="2" width="3" height="3"/>
        <rect x="6" y="5" width="1" height="2"/>
        <rect x="3" y="6" width="7" height="1"/>
      </g>
      <!-- legs to the footpads -->
      <rect x="5" y="7" width="1" height="1"/><rect x="4" y="8" width="1" height="1"/><rect x="3" y="9" width="1" height="1"/>
      <rect x="7" y="7" width="1" height="1"/><rect x="8" y="8" width="1" height="1"/><rect x="9" y="9" width="1" height="1"/>
      <!-- split deck: two footpads, tire between them -->
      <rect x="2" y="10" width="3" height="1"/>
      <rect x="8" y="10" width="3" height="1"/>
    </g>
    <!-- the fat center tire, bulging above the deck -->
    <g fill="var(--accent)">
      <rect x="6" y="8" width="1" height="1"/>
      <rect x="5" y="9" width="3" height="1"/>
      <rect x="5" y="10" width="3" height="1"/>
      <rect x="5" y="11" width="3" height="1"/>
      <rect x="6" y="12" width="1" height="1"/>
    </g>
  </svg>
</template>
