<div class="island island-l" aria-hidden="true">

    <rect x="1" y="0" width="18" height="2" fill="var(--accent)"/>
    <g fill="var(--ink)">
      <rect x="2" y="2" width="16" height="2"/>
      <rect x="4" y="4" width="12" height="2"/>
      <rect x="7" y="6" width="6" height="2"/>
      <rect x="9" y="8" width="2" height="2"/>
    </g>
    <rect x="1" y="2" width="1" height="2" fill="var(--accent)"/>
  </svg>
</div>

    <rect x="1" y="0" width="14" height="2" fill="var(--accent)"/>
    <g fill="var(--ink)">
      <rect x="2" y="2" width="12" height="2"/>
      <rect x="4" y="4" width="8" height="2"/>
      <rect x="6" y="6" width="4" height="2"/>

    <rect x="14" y="2" width="1" height="2" fill="var(--accent)"/>
