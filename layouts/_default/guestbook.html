{{ define "main" }}
<article class="page">
  <h1>{{ .Title }}</h1>
  {{ .Content }}

  <form id="gb-form" class="gb-form" autocomplete="off">
    <label for="gb-name">name</label>
    <input id="gb-name" name="name" type="text" maxlength="40" placeholder="anonymous">
    <label for="gb-msg">message</label>
    <textarea id="gb-msg" name="msg" maxlength="500" rows="3" required placeholder="you were here. prove it."></textarea>
    <div class="gb-website"><label for="gb-website">website</label><input id="gb-website" name="website" type="text" tabindex="-1"></div>
    <button class="btn" type="submit">SIGN →</button>
    <span id="gb-status" role="status"></span>
  </form>

  <ul id="gb-entries" class="updates"></ul>
  <p id="gb-empty" hidden>Nobody has signed yet. The ink is fresh.</p>
</article>
{{ end }}
